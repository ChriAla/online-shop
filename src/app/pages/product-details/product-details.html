@if (product) {
  <div class="details-container">
    <img
      class="details-image"
      [src]="product.image"
      [alt]="product.name"
    />

    <div class="details-info">
      <h1>{{ product.name }}</h1>

      <p class="price">
        {{ product.price | currency: 'EUR' }}
      </p>

      <p class="description">
        {{ product.description }}
      </p>

      <button (click)="addToCart()">
        Add to Cart
      </button>
    </div>
  </div>
}
